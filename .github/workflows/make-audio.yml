name: Make audio and publish the site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wayside
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find out what needs new audio
        id: plan
        run: python3 tools/make_audio.py --plan

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.needed == 'true'
        with:
          python-version: '3.12'

      - name: Remember the voice between runs
        if: steps.plan.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: .voice
          key: voice-da-talesyntese-medium-v1

      - name: Get the voice and tools
        if: steps.plan.outputs.needed == 'true'
        run: |
          if [ ! -f .voice/da_DK-talesyntese-medium.onnx ]; then
            mkdir -p .voice
            curl -sL -o voice.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-da_DK-talesyntese-medium.tar.bz2
            tar xjf voice.tar.bz2 -C .voice --strip-components=1 \
              vits-piper-da_DK-talesyntese-medium/da_DK-talesyntese-medium.onnx \
              vits-piper-da_DK-talesyntese-medium/da_DK-talesyntese-medium.onnx.json
            rm voice.tar.bz2
          fi
          pip install --quiet piper-tts
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Make the audio
        if: steps.plan.outputs.needed == 'true'
        run: VOICE_DIR=.voice python3 tools/make_audio.py

      - name: Save the new audio in the repository
        if: steps.plan.outputs.needed == 'true'
        run: |
          git config user.name "wayside-bot"
          git config user.email "wayside-bot@users.noreply.github.com"
          git add ture
          if git diff --cached --quiet; then
            echo "Nothing to save"
          else
            git commit -m "Audio: update"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  deploy:
    needs: audio
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
