name: Make audio and publish the site

on:
  push:
    branches: [main]
  schedule:
    # Three times a day, at odd minutes: GitHub delays or skips scheduled runs when it is busy (most at the start of the hour), and one run a day was not enough.
    # A run that finds nothing to do ends in seconds. A run after the daily limit is used up stops at once. Times are UTC (Danish time is one or two hours later).
    - cron: '23 8 * * *'          # 09:23 or 10:23 Danish time: just after Google's daily limit has been reset
    - cron: '41 11 * * *'         # 12:41 or 13:41 Danish time
    - cron: '7 15 * * *'          # 16:07 or 17:07 Danish time
  workflow_dispatch:
    inputs:
      chain:
        description: 'Counter used when the job starts itself again. Leave at 0.'
        required: false
        default: '0'

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  # ---- 1. The site goes online at once, without waiting for the audio ----
  build_site:
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || (inputs.chain || '0') == '0') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy_site:
    needs: build_site
    runs-on: ubuntu-24.04
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ---- 2. The audio is made next to it and saved in the repository ----
  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: wayside-audio
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONUNBUFFERED: '1'
      AUDIO_CHAIN: ${{ inputs.chain || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Find out what needs new audio
        id: plan
        run: python3 tools/make_audio.py --plan

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.needed == 'true'
        with:
          python-version: '3.12'

      - name: Get ffmpeg (from Python, no apt, which can be very slow)
        if: steps.plan.outputs.needed == 'true'
        timeout-minutes: 6
        run: |
          set -euxo pipefail
          if python -m pip install --quiet imageio-ffmpeg; then
            python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          else
            echo "pip did not work, trying apt instead"
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi

      - name: Remember the Piper voice between runs
        if: steps.plan.outputs.piper == 'true'
        uses: actions/cache@v4
        with:
          path: .voice
          key: voice-da-talesyntese-medium-v1

      - name: Get the Piper voice and tools
        if: steps.plan.outputs.piper == 'true'
        run: |
          set -euxo pipefail
          command -v bzip2 >/dev/null || sudo apt-get install -y -qq bzip2
          if [ ! -f .voice/da_DK-talesyntese-medium.onnx ]; then
            mkdir -p .voice
            curl -fsSL --retry 3 -o voice.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-da_DK-talesyntese-medium.tar.bz2
            tar xjf voice.tar.bz2 -C .voice --strip-components=1 \
              vits-piper-da_DK-talesyntese-medium/da_DK-talesyntese-medium.onnx \
              vits-piper-da_DK-talesyntese-medium/da_DK-talesyntese-medium.onnx.json
            rm voice.tar.bz2
          fi
          python --version
          python -m pip install --quiet piper-tts
          python -c "import piper; print('piper ok')"

      - name: Make the audio
        id: make
        if: steps.plan.outputs.needed == 'true'
        run: |
          set -euxo pipefail
          VOICE_DIR=.voice python tools/make_audio.py

      - name: Save the new audio in the repository
        id: save
        if: ${{ !cancelled() && steps.plan.outputs.needed == 'true' }}
        run: |
          set -eux
          echo "changed=false" >> "$GITHUB_OUTPUT"
          git config user.name "wayside-bot"
          git config user.email "wayside-bot@users.noreply.github.com"
          git add ture
          if git diff --cached --quiet; then
            echo "Nothing to save"
          else
            git commit -m "Audio: update"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Could not save yet, trying again ($attempt)"
              sleep 5
            done
            exit 1
          fi

      - name: Start the job again if stops are still missing
        if: ${{ !cancelled() && steps.make.outputs.more == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh workflow run make-audio.yml --ref main -f chain=$(( AUDIO_CHAIN + 1 ))

  # ---- 3. When new audio was saved, the site is published once more ----
  build_again:
    needs: audio
    if: ${{ !cancelled() && needs.audio.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-again
          path: .

  deploy_again:
    needs: build_again
    runs-on: ubuntu-24.04
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-again
